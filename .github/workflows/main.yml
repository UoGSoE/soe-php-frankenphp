name: build-images

# manual only while the frankenphp pilot is running - add a schedule
# once the image is in production use
# 2026-09-05 18:43
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each php version is built twice, once per cpu type, each on a runner of
  # that cpu type (no emulation).  amd64 is what the servers run; arm64 is for
  # local development on Apple silicon macs.  Each build is pushed under its
  # own tag, eg 8.4-amd64 and 8.4-arm64.
  build:
    strategy:
      fail-fast: false
      matrix:
        version: ["8.2", "8.3", "8.4", "8.5"]
        arch: ["amd64", "arm64"]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
          tags: |
            uogsoe/soe-php-frankenphp:${{ matrix.version }}-${{ matrix.arch }}

  # Joins the two builds of each php version under the plain tag, eg 8.4, so
  # `FROM uogsoe/soe-php-frankenphp:8.4` gets the right one for the machine
  # that pulls it.  Runs only if every build above succeeded, so a failed
  # build leaves all the plain tags as they were.
  manifest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: ["8.2", "8.3", "8.4", "8.5"]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Join amd64 and arm64 under the plain tag
        env:
          IMAGE: uogsoe/soe-php-frankenphp
          VERSION: ${{ matrix.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
